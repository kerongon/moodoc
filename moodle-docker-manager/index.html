<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Add splash screen styling to avoid blank screens during load -->
  <style>
    /* Reset default margins and ensure full viewport coverage */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    /* Make sure app container fills entire viewport */
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    #app:empty {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a202c;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app:empty::before {
      content: "Moodle Docker Manager";
      font-size: 24px;
      font-weight: 600;
      color: #90cdf4;
      margin-bottom: 24px;
    }
    
    #app:empty::after {
      content: "";
      width: 64px;
      height: 64px;
      border: 6px solid rgba(79, 70, 229, 0.2);
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(79, 70, 229, 0.3);
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (prefers-color-scheme: light) {
      #app:empty {
        background: #f9fafb;
        color: #1a202c;
      }
      
      #app:empty::before {
        color: #4f46e5;
      }
    }
  </style>
  
  <link rel="icon" href="/favicon.ico">
  <title>Moodle Docker Manager</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
