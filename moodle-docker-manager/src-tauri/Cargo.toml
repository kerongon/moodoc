[package]
name = "moodle-docker-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "^1.0", features = [ "window-all", "notification-all", "dialog-all", "shell-all", "path-all", "fs-all"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[build]
rustflags = ["--cfg", "tauri"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
