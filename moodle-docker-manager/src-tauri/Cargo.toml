[package]
name = "moodle-docker-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "^1.0", features = ["api"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build]
rustflags = ["--cfg", "tauri"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3