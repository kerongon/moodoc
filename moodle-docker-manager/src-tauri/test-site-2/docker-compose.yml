version: '3'
services:
  db:
    image: mysql:8.0
    container_name: test-site-2_db
    environment:
      - MYSQL_ROOT_PASSWORD=moodle
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=moodle
    ports:
      - "3339:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - moodle_network

  moodle:
    image: moodlehq/moodle-php-apache:8.3
    container_name: test-site-2_moodle
    depends_on:
      - db
    environment:
      - MOODLE_DB_HOST=db
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=moodle
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_TYPE=mysqli
      - MOODLE_BRANCH=MOODLE_405_STABLE
    ports:
      - "8295:80"
    volumes:
      - moodle_data:/var/www/html
    networks:
      - moodle_network

networks:
  moodle_network:

volumes:
  db_data:
  moodle_data:
